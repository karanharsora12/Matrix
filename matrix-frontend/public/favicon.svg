<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Matrix grid overlay lines in the background -->
  <path d="M12 16h40M12 28h40M12 40h40M12 52h40" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 3" />
  <path d="M16 12v40M28 12v40M40 12v40M52 12v40" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Isometric 3D Matrix Cube / Box Icon -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M32 14 L46 22 L32 30 L18 22 Z" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <path d="M18 22 L32 30 L32 46 L18 38 Z" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <path d="M32 30 L46 22 L46 38 L32 46 Z" fill="url(#cubeRight)" />
    
    <!-- Inner Stylized "M" Structure Lines -->
    <path d="M25 24 L32 28 L39 24" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M32 30 L32 45" stroke="#1e40af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>